async function saveBg(){view_st();await saveSub()}function view_st(){if(!$('#st'))app.insertAdjacentHTML('beforeend','<p id="st" class="noprint"></p>')}
// admin
let unsub=null;
function admin(){view(`<h1>Admin</h1><div id="ad"></div>`);dash($('#ad'),{email:'Admin panel'})}
function login(ad,m=''){ad.innerHTML=`<form class="glass" id="lf"><p class="err">${m}</p><input name="e" type="email" placeholder="Admin email" required autocomplete="username"><input name="p" type="password" placeholder="Password" required autocomplete="current-password"><button class="btn">Login</button></form>`;$('#lf').onsubmit=async e=>{e.preventDefault();try{await signInWithEmailAndPassword(auth,e.target.e.value,e.target.p.value)}catch(x){login(ad,'Login failed: '+esc(x.code))}}}
function dash(ad,u){let rows=[],q='',desc=true,sel=new Set();
ad.innerHTML=`<div class="row"><span>${esc(u.email)}</span><button class="btn sm" id="lo"><i data-lucide="log-out"></i> Bondho koro</button></div><div class="row"><input id="q" placeholder="Search name…" style="flex:1"><button class="btn sm" id="so">Newest first</button><button class="btn sm" id="ex">Export CSV</button><button class="btn sm red" id="da">Delete all</button></div><p id="m" class="k">Loading…</p><div id="ls"></div>`;lucide.createIcons();
const draw=()=>{let v=rows.filter(r=>(r.name||'').toLowerCase().includes(q.toLowerCase())).sort((a,b)=>desc?b.createdAt-a.createdAt:a.createdAt-b.createdAt);$('#m').textContent=`${v.length} submission(s) · live`;
$('#ls').innerHTML=v.map(r=>`<div class="adm glass"><div class="row"><input type="checkbox" data-s="${esc(r.id)}" style="width:auto;margin:0" ${sel.has(r.id)?'checked':''}><b>${esc(r.name)}</b> ${esc(r.age)} · ${esc(r.gender)} · ${esc(r.rel)} · ${new Date(r.createdAt).toLocaleString()}<button class="btn sm red" data-d="${esc(r.id)}">Delete</button></div><details><summary>${esc(r.personality)} · Forever: ${esc(r.forever)}</summary>${(r.questions||[]).map((x,i)=>`<p><b>Q${i+1}.</b> ${esc(x.option)}<br><i>${esc(x.written)}</i></p>`).join('')}<p>${esc(JSON.stringify(r.scores))}</p>${(r.letters||[]).map(l=>`<div class="paper"><h2>${esc(l.t)}</h2>${br(l.b)}</div>`).join('')}</details></div>`).join('')||'<p>No submissions yet.</p>';
document.querySelectorAll('[data-s]').forEach(c=>c.onchange=()=>c.checked?sel.add(c.dataset.s):sel.delete(c.dataset.s));
document.querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{if(confirm('Delete this submission?'))try{await remove(ref(db,'herHeart/submissions/'+b.dataset.d))}catch(e){alert(e.code||e.message)}})};
unsub=onValue(SUB(),s=>{rows=[];s.forEach(c=>{rows.push({id:c.key,...c.val()})});draw()},e=>{$('#m').innerHTML=`<span class="err">${e.code==='PERMISSION_DENIED'||/permission/i.test(e.message)?'Permission denied: Firebase rules-e read allow kora nei.':esc(e.message)}</span>`});
$('#q').oninput=e=>{q=e.target.value;draw()};$('#so').onclick=e=>{desc=!desc;e.target.textContent=desc?'Newest first':'Oldest first';draw()};$('#lo').onclick=()=>go('welcome');
$('#ex').onclick=()=>{const v=rows.filter(r=>sel.size?sel.has(r.id):true),c=x=>'"'+String(x??'').replace(/"/g,'""').replace(/^([=+\-@])/,"'$1")+'"';const h=['id','name','age','gender','relationship','forever','personality','date',...Q.map((_,i)=>'Q'+(i+1)+'_option'),...Q.map((_,i)=>'Q'+(i+1)+'_written')];const l=[h.map(c).join(',')].concat(v.map(r=>[r.id,r.name,r.age,r.gender,r.rel,r.forever,r.personality,new Date(r.createdAt).toISOString(),...(r.questions||[]).map(x=>x.option),...(r.questions||[]).map(x=>x.written)].map(c).join(',')));const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+l.join('\n')],{type:'text/csv'}));a.download='her-heart.csv';a.click()};
$('#da').onclick=async()=>{if(!confirm('Delete ALL submissions?'))return;if(prompt('Type DELETE to confirm')!=='DELETE')return;try{await remove(SUB())}catch(e){alert(e.code||e.message)}}}
// hidden shortcut: A twice quickly
let la=0;addEventListener('keydown',e=>{if(e.key.toLowerCase()!=='a'||e.repeat||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;const t=Date.now();if(t-la<450){go('admin');la=0}else la=t});
addEventListener('hashchange',()=>{if(unsub){unsub();unsub=null}R()});R();
